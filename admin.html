<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#202b40">
<title>Panel de gestión · Xinyuan Import</title><link rel="icon" type="image/png" href="img/logo.png"><link rel="apple-touch-icon" href="img/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="toast" class="toast" role="status"></div>
<section id="authScreen" class="auth-screen"><div class="auth-card"><a class="auth-brand" href="index.html">XINYUAN <b>IMPORT</b></a><p class="eyebrow">PANEL PRIVADO</p><h1 id="authTitle">Iniciar sesión</h1><p id="authSubtitle" class="muted">Acceso exclusivo para el equipo de trabajo.</p>
<form id="loginForm" autocomplete="on"><label>Usuario<input name="username" autocomplete="username" required minlength="3"></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button class="btn primary" type="submit">Ingresar al panel</button></form>
<form id="setupForm" hidden><label>Nombre de usuario<input name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[a-zA-Z0-9._-]+" title="Usa letras, números, punto, guion o guion bajo."></label><label>Contraseña (mínimo 10 caracteres)<input name="password" type="password" autocomplete="new-password" required minlength="10"></label><button class="btn primary" type="submit">Crear cuenta OWNER</button></form>
<a class="back-link" href="index.html">← Volver al catálogo</a></div></section>
<div id="appShell" class="app-shell" hidden>
<aside class="sidebar"><a class="side-brand" href="index.html">XINYUAN <b>IMPORT</b><small>GESTIÓN COMERCIAL</small></a><nav id="sideNav">
<button class="nav-item active" data-view="dashboard"><span>▦</span>Resumen</button><button class="nav-item" data-view="sales"><span>↗</span>Ventas</button><button class="nav-item" data-view="inventory"><span>▤</span>Inventario</button><button class="nav-item" data-view="cash"><span>◷</span>Caja</button><button class="nav-item" data-view="users"><span>♙</span>Usuarios y permisos</button><button class="nav-item" data-view="reports"><span>▥</span>Reportes</button><button class="nav-item" data-view="audit"><span>◉</span>Actividad</button>
</nav><div class="side-bottom"><a href="index.html">↗ Ver catálogo público</a></div></aside>
<main class="main"><header class="topbar"><div><span class="eyebrow">PANEL DE CONTROL</span><h1 id="pageTitle">Resumen general</h1></div><div class="top-actions"><span class="today" id="todayLabel"></span><button class="btn light" id="passwordBtn">Cambiar contraseña</button><button class="btn light" id="refreshBtn">↻ Actualizar</button><div class="account-wrap"><button class="account-trigger" id="accountBtn" type="button" aria-label="Abrir menú de usuario" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4.2 4.2 0 1 0 0-8.4A4.2 4.2 0 0 0 12 12Zm0 2.1c-4.1 0-7.4 2.1-7.4 4.8V21h14.8v-2.1c0-2.7-3.3-4.8-7.4-4.8Z"/></svg></button><div class="account-menu" id="accountMenu" hidden><div class="account-menu-user"><strong id="profileName">Usuario</strong><small id="profileRole">ROL</small></div><button id="logoutBtn" class="account-logout" type="button">↪ Cerrar sesión</button></div></div></div></header>
<div id="viewContent" class="view-content"><div class="loading">Cargando información…</div></div></main></div>
<script src="admin.js"></script>
</body></html>
